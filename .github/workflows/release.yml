name: Android Release

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $HOME/signing_key.jks

      - name: Assemble APK
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDaily
          fi
        env:
          space_sign_key: ${{ secrets.SIGNING_KEY }}
          space_sign_alias: ${{ secrets.ALIAS }}
          space_sign_store_password: ${{ secrets.STORE_PASSWORD }}
          space_sign_key_password: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: Signed app bundle
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    if: (github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Signed app bundle
          path: release-assets

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
